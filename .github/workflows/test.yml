name: test
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - run: pip install -e '.[linting]'
    - run: python -m ruff check .
    - run: python -m mypy
    - run: python -m unittest -v
    - run: MAX_LINE_COUNT=3000 python sz.py
  terms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TERMS: ${{ secrets.TERMS }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - if: env.TERMS != ''
      run: |
        printf '%s\n' "$TERMS" | grep . > "$RUNNER_TEMP/terms"
        if git grep -lIiF -f "$RUNNER_TEMP/terms"; then echo "banned term in tree"; exit 1; fi
        if git log --format='%an%n%ae%n%B' | grep -qiF -f "$RUNNER_TEMP/terms"; then echo "banned term in history"; exit 1; fi
